const CAT_STYLE = {"生活化学": ["#e8f5e9", "#2e7d32", "fa-house-chimney"], "教学资源": ["#e3f2fd", "#1565c0", "fa-chalkboard-user"], "前沿动态": ["#ede7f6", "#5e35b1", "fa-rocket"], "实验安全": ["#fff3e0", "#e65100", "fa-triangle-exclamation"], "趣味化学": ["#fce4ec", "#ad1457", "fa-face-laugh-beam"], "化学史人物": ["#efebe9", "#4e342e", "fa-user-graduate"]};
const decisions = {};  // id -> "approved" | "rejected"

function esc(s) {
  return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function render() {
  const list = document.getElementById("list");
  if (!DATA.length) {
    list.innerHTML = '<div class="empty-tip">今天没有待审内容，好好休息 ✨</div>';
    return;
  }
  let html = "";
  DATA.forEach(a => {
    const [bg, fg] = CAT_STYLE[a.category] || ["#f0f3f6","#5d6d7e"];
    const safety = a.safety_flag ? '<div class="safety"><i class="fas fa-triangle-exclamation"></i> 安全提示：此条内容含实验或操作风险，请重点确认表述是否安全</div>' : "";
    html += `
    <div class="review-card" id="card-${a.id}">
      <div class="card-top">
        <div class="card-title">
          <a href="${esc(a.source_url)}" target="_blank" rel="noopener">${esc(a.title)}</a>
        </div>
        <span class="cat-badge" style="background:${bg};color:${fg}">${esc(a.category)}</span>
      </div>
      <div class="card-meta">
        <span><i class="fas fa-newspaper"></i> ${esc(a.source_name)}</span>
        <span><i class="fas fa-calendar"></i> ${esc(a.publish_date)}</span>
        <span class="quality"><i class="fas fa-star"></i> 质量分 ${a.quality_score}</span>
        <span><i class="fas fa-graduation-cap"></i> ${esc(a.grade_level)}</span>
      </div>
      <div class="summary">${esc(a.ai_summary)}</div>
      ${safety}
      <div class="card-actions">
        <button class="btn btn-approve" onclick="decide('${a.id}','approved')"><i class="fas fa-check"></i> 通过</button>
        <button class="btn btn-reject" onclick="decide('${a.id}','rejected')"><i class="fas fa-xmark"></i> 拒绝</button>
      </div>
    </div>`;
  });
  list.innerHTML = html;
}

function decide(id, st) {
  decisions[id] = st;
  const card = document.getElementById("card-" + id);
  card.classList.remove("decided-approve", "decided-reject");
  card.classList.add(st === "approved" ? "decided-approve" : "decided-reject");
  updateResult();
}

function approveAll() {
  DATA.forEach(a => {
    decisions[a.id] = "approved";
    const card = document.getElementById("card-" + a.id);
    if (card) {
      card.classList.remove("decided-reject");
      card.classList.add("decided-approve");
    }
  });
  updateResult();
}

function resetAll() {
  Object.keys(decisions).forEach(k => delete decisions[k]);
  document.querySelectorAll(".review-card").forEach(c => c.classList.remove("decided-approve","decided-reject"));
  updateResult();
}

function updateResult() {
  const approved = Object.keys(decisions).filter(k => decisions[k] === "approved");
  const rejected = Object.keys(decisions).filter(k => decisions[k] === "rejected");
  let lines = [];
  if (approved.length) lines.push("通过: " + approved.join(","));
  if (rejected.length) lines.push("拒绝: " + rejected.join(","));
  document.getElementById("result").value = lines.join("\n") || "";
  document.getElementById("count").textContent =
    `已处理 ${approved.length + rejected.length} / ${DATA.length} 条（通过 ${approved.length}，拒绝 ${rejected.length}）`;
}

function copyResult() {
  const t = document.getElementById("result");
  t.select();
  navigator.clipboard.writeText(t.value).then(() => {
    const btn = document.querySelector(".btn-copy");
    const old = btn.innerHTML;
    btn.innerHTML = '<i class="fas fa-check"></i> 已复制';
    setTimeout(() => btn.innerHTML = old, 1500);
  });
}

render();
updateResult();
</script>
</body>
